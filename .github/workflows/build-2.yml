name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter project
        run: |
          flutter create --org com.combineia --project-name combine_ia app
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart
          rm -f app/test/widget_test.dart
          MANIFEST=app/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST
          sed -i 's|android:label="combine_ia"|android:label="Combine IA"|' $MANIFEST

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: combine-ia-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
